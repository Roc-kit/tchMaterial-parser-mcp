[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tchmaterial-parser-mcp"
version = "0.1.0"
description = "MCP adapter for tchMaterial-parser"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "mcp>=2,<3",
    "pypdf>=5,<7",
    "requests>=2.31,<3",
]

[project.scripts]
"tchmaterial-parser-mcp" = "tchmaterial_parser_mcp.server:main"

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

